<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnergiOS responsive QA</title><style>body{margin:0;background:#dde7ed;font:12px Arial;color:#36586b}header{padding:9px 12px;background:white;position:sticky;top:0;z-index:1}#frame{border:0;display:block;transform-origin:top left;background:white}#wrap{margin:12px auto;overflow:hidden;box-shadow:0 5px 20px #26425320}#status{font-weight:bold;color:#207963}</style></head><body><header>EnergiOS responsive check · <span id="status">Loading…</span></header><div id="wrap"><iframe id="frame" title="EnergiOS test viewport"></iframe></div><script>
const p=new URLSearchParams(location.search),width=Number(p.get('width'))||1440,height=Number(p.get('height'))||1000,route=p.get('route')||'overview',frame=document.getElementById('frame'),wrap=document.getElementById('wrap'),scale=Math.min(1,(innerWidth-24)/width);frame.width=width;frame.height=height;frame.style.transform=`scale(${scale})`;wrap.style.width=`${width*scale}px`;wrap.style.height=`${height*scale}px`;frame.src='/#'+encodeURIComponent(route);frame.onload=()=>{if(!frame.contentDocument?.body)return;const check=()=>{const doc=frame.contentDocument,overflow=doc.documentElement.scrollWidth>width;document.getElementById('status').textContent=`${width} × ${height} · content ${doc.documentElement.scrollWidth}px · ${overflow?'OVERFLOW':'No horizontal overflow'}`};new MutationObserver(check).observe(frame.contentDocument.body,{subtree:true,childList:true,attributes:true});setInterval(check,1000);check()};
</script></body></html>
