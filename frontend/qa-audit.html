<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnergiOS screen audit</title><style>body{font:13px Arial;background:#eef4f7;color:#244456;margin:20px}table{border-collapse:collapse;background:white;width:100%}td,th{padding:8px 12px;text-align:left;border-bottom:1px solid #e1e9ef}.pass{color:#17886a}.fail{color:#c44}iframe{border:1px solid #d2e1e9;position:absolute;top:1600px;left:0}#status{padding:12px 0;font-weight:bold}</style></head><body><h1>EnergiOS responsive screen audit</h1><p>Each screen is rendered at the listed viewport using the local application API.</p><div id="status">Starting…</div><table><thead><tr><th>Viewport</th><th>Screen</th><th>Result</th></tr></thead><tbody id="results"></tbody></table><div id="host"></div><script>
const routes=['overview','monitoring','simulator','carbon','twin','control','copilot'],widths=[390,768,1440],results=document.getElementById('results');
async function renderCase(width,route){return new Promise(resolve=>{const frame=document.createElement('iframe');frame.width=width;frame.height=900;frame.title=`${route} at ${width}px`;document.getElementById('host').replaceChildren(frame);let checks=0;frame.src='/#'+route;frame.onload=()=>{const timer=setInterval(()=>{checks++;const doc=frame.contentDocument,heading=doc.querySelector('h1'),error=doc.querySelector('.error');if(heading||error||checks>60){clearInterval(timer);const ok=!!heading&&!error&&doc.documentElement.scrollWidth<=doc.documentElement.clientWidth;resolve({ok,text:error?.textContent||(!heading?'Load timeout':`${doc.documentElement.clientWidth}px content · ${ok?'No horizontal overflow':'OVERFLOW'}`)})}},200)}})}
(async()=>{let passed=0,total=0;for(const width of widths)for(const route of routes){document.getElementById('status').textContent=`Rendering ${route} at ${width}px…`;const result=await renderCase(width,route);total++;passed+=Number(result.ok);const row=document.createElement('tr');row.innerHTML=`<td>${width} × 900</td><td>${route}</td><td class="${result.ok?'pass':'fail'}">${result.ok?'PASS':'FAIL'} · ${result.text}</td>`;results.appendChild(row)}document.getElementById('host').replaceChildren();document.getElementById('status').textContent=`Complete: ${passed}/${total} screens passed`;document.getElementById('status').className=passed===total?'pass':'fail'})();
</script></body></html>
